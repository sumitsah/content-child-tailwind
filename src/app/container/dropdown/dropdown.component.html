<div class="relative inline-block text-left">
    <!-- 1. This is where the parent projects the trigger button/image -->
    <ng-content select="[dropdown]"></ng-content>

    <!-- 2. The dropdown menu layout itself -->
    @if (isOpen) {
    <div
        class="absolute right-0 z-10 mt-2 w-56 origin-top-right rounded-md bg-white p-2 shadow-lg ring-1 ring-black/5 focus:outline-none animate-in fade-in slide-in-from-top-1 duration-100">
        <!-- This is where the parent projects the actual list of menu links -->
        <ng-content select=".menu-items"></ng-content>
    </div>
    }
</div>
