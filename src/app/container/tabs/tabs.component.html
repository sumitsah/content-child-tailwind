<div class="w-full max-w-xl mx-auto mt-6">
    <!-- 1. Dynamic Navigation Headers Generated from Projected Content -->
    <div class="flex border-b border-gray-200">
        <button *ngFor="let tab of tabs; let i = index" (click)="selectTab(tab)" [ngClass]="{
            'border-pink-600 text-pink-600 font-semibold border-b-2': tab.active,
            'text-gray-500 hover:text-gray-700': !tab.active
          }" class="py-2.5 px-5 text-sm font-medium cursor-pointer transition-all duration-200">
            {{ tab.title }}
        </button>
    </div>

    <ng-content></ng-content>

</div>
